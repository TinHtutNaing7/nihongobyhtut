<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N1 過去問 語彙帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;500&family=Shippori+Mincho+B1:wght@600;700&display=swap">
<style>
/* Layout: sticky toolbar over a single-column list of vocabulary entries; word block left, meaning/example right, stacked on phones. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b2233; --muted:#5b647a; --line:#dde1ea;
  --accent:#2f4fb3; --accent-soft:#e7ecfb; --hot:#a8480a; --hot-soft:#fbeedd;
  --t1:#2f4fb3; --t1s:#e7ecfb; --t2:#0e7a6e; --t2s:#dff3ef; --t3:#8a3b8f; --t3s:#f3e4f4; --t4:#7a6a00; --t4s:#f6f0cf;
  --mark:#ffe58a;
  --f-word:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-my:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2b; --ink:#e8ebf2; --muted:#98a1b6; --line:#2b3242;
  --accent:#9bb1ff; --accent-soft:#232c4a; --hot:#f0b073; --hot-soft:#3a2c1c;
  --t1:#9bb1ff; --t1s:#232c4a; --t2:#6fd3c4; --t2s:#16342f; --t3:#e0a2e5; --t3s:#37223a; --t4:#e3d26a; --t4s:#35300f;
  --mark:#6b5a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2b; --ink:#e8ebf2; --muted:#98a1b6; --line:#2b3242;
  --accent:#9bb1ff; --accent-soft:#232c4a; --hot:#f0b073; --hot-soft:#3a2c1c;
  --t1:#9bb1ff; --t1s:#232c4a; --t2:#6fd3c4; --t2s:#16342f; --t3:#e0a2e5; --t3s:#37223a; --t4:#e3d26a; --t4s:#35300f;
  --mark:#6b5a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:980px;margin:0 auto}
header{padding-block:28px 14px}
h1{font-family:var(--f-word);font-weight:700;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch;font-size:.92rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:1.05rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search:focus-visible,button:focus-visible,select:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);align-items:center}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
select{font:inherit;font-size:.84rem;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.count{margin-left:auto;font-variant-numeric:tabular-nums}
h2.grp{font-family:var(--f-word);font-size:1.15rem;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px}
h2.grp span{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400}
.list{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 22px}
.card.known{opacity:.55}
.wd{min-width:0}
.w{font-family:var(--f-word);font-weight:700;font-size:1.55rem;line-height:1.3;overflow-wrap:anywhere}
.r{color:var(--accent);font-size:.95rem;margin-top:2px}
.en{color:var(--muted);font-size:.8rem;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:.7rem;padding:1px 8px;border-radius:4px;letter-spacing:.03em}
.t-読み方{background:var(--t1s);color:var(--t1)} .t-文脈規定{background:var(--t2s);color:var(--t2)}
.t-言い換え{background:var(--t3s);color:var(--t3)} .t-用法{background:var(--t4s);color:var(--t4)}
.hot{background:var(--hot-soft);color:var(--hot);font-weight:700}
.body{min-width:0;display:grid;gap:8px;align-content:start}
.my{font-family:var(--f-my);line-height:1.95;font-size:.98rem;overflow-wrap:anywhere}
.syn{font-size:.9rem}.syn b{color:var(--t3);font-weight:500}
.ex{border-top:1px dashed var(--line);padding-top:8px;font-size:.92rem}
.ex .jp{font-family:var(--f-body)}
.ex .exmy{font-family:var(--f-my);color:var(--muted);font-size:.88rem;line-height:1.9}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.src label{margin-left:auto;display:flex;gap:5px;align-items:center;cursor:pointer}
.hide-m .my,.hide-m .syn{filter:blur(7px);cursor:pointer;user-select:none}
.hide-m .card.show .my,.hide-m .card.show .syn{filter:none;user-select:auto}
.hide-r .r{filter:blur(6px)}
.hide-r .card.show .r{filter:none}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:36px;color:var(--muted);font-size:.78rem;max-width:70ch}
@media (max-width:620px){.card{grid-template-columns:1fr}.w{font-size:1.45rem}.count{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>N1 過去問 語彙帳</h1>
    <p class="sub">2010年〜2025年の日本語能力試験N1「文字・語彙」問題1〜4に出た語を、重複をまとめて一覧にしました。意味はミャンマー語の解説です。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="単語・読み・ミャンマー語で検索" aria-label="検索" autocomplete="off">
    <div class="row" id="secs" role="group" aria-label="問題の区分"></div>
    <div class="opts">
      <label for="sort">並び順
        <select id="sort">
          <option value="sec">区分別</option>
          <option value="freq">頻出順</option>
          <option value="kana">五十音順</option>
          <option value="new">出題が新しい順</option>
        </select></label>
      <label for="f-hot"><input type="checkbox" id="f-hot">2回以上出題</label>
      <label for="f-known"><input type="checkbox" id="f-known">覚えた語を隠す</label>
      <label for="h-m"><input type="checkbox" id="h-m">意味を隠す</label>
      <label for="h-r"><input type="checkbox" id="h-r">読みを隠す</label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>

  <main id="out"><div class="empty">読み込み中…</div></main>
  <footer>出典：日本語能力試験N1の過去問（2010年7月〜2025年12月、31回分）の言語知識（文字・語彙）問題1〜4に対する、AIの解答とミャンマー語解説。意味や読みは試験前に辞書で確認してください。「覚えた」のチェックはこのブラウザにだけ保存されます。</footer>
</div>

<script>
(function(){
  var SECS=['読み方','文脈規定','言い換え','用法'];
  var SECNAME={'読み方':'問題1 漢字の読み','文脈規定':'問題2 文脈規定','言い換え':'問題3 言い換え類義','用法':'問題4 用法'};
  var DATA=[],state={q:'',sec:'all',sort:'sec',hot:false,known:false};
  var KNOWN={};
  try{KNOWN=JSON.parse(localStorage.getItem('n1vocab-known')||'{}')||{}}catch(e){KNOWN={}}
  function saveKnown(){try{localStorage.setItem('n1vocab-known',JSON.stringify(KNOWN))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function hira(s){return String(s||'').replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96)}).toLowerCase()}
  function ym(e){var m=/(\d+)年(\d+)月/.exec(e);return +m[1]*100+ +m[2]}
  function newest(it){return Math.max.apply(null,it.ex.map(function(e){return ym(e[0])}))}
  function sortKey(it){return hira(it.r||it.w)}
  function hl(sentence,w){
    var stem=w.replace(/(する|だ|な|に)$/,'').replace(/^〜/,'');
    var i=stem.length>0?sentence.indexOf(stem):-1;
    if(i<0)return esc(sentence);
    return esc(sentence.slice(0,i))+'<mark>'+esc(stem)+'</mark>'+esc(sentence.slice(i+stem.length));
  }
  function card(it){
    var known=!!KNOWN[it.w];
    var h='<article class="card'+(known?' known':'')+'" data-w="'+esc(it.w)+'">';
    h+='<div class="wd"><div class="w">'+esc(it.w)+'</div>';
    if(it.r)h+='<div class="r">'+esc(it.r)+'</div>';
    if(it.alt)h+='<div class="en">'+esc(it.alt)+'</div>';
    if(it.en)h+='<div class="en">'+esc(it.en)+'</div>';
    h+='<div class="tags">';
    if(it.ex.length>1)h+='<span class="tag hot">'+it.ex.length+'回出題</span>';
    it.secs.forEach(function(s){h+='<span class="tag t-'+s+'">'+esc(s)+'</span>'});
    h+='</div></div><div class="body">';
    h+='<div class="my">'+esc(it.m)+'</div>';
    if(it.syn)h+='<div class="syn"><b>言い換え</b>　'+esc(it.syn)+'</div>';
    if(it.s)h+='<div class="ex"><div class="jp">'+hl(it.s[0],it.w)+'</div>'+(it.s[1]?'<div class="exmy">'+esc(it.s[1])+'</div>':'')+'</div>';
    h+='<div class="src">'+it.ex.slice(0,4).map(function(e){return '<span>'+esc(e[0])+' 第'+e[1]+'問</span>'}).join('')+(it.ex.length>4?'<span>ほか'+(it.ex.length-4)+'件</span>':'');
    h+='<label><input type="checkbox" class="kn"'+(known?' checked':'')+'>覚えた</label></div>';
    h+='</div></article>';
    return h;
  }
  function match(it,q){
    if(!q)return true;
    var hay=hira([it.w,it.r,it.alt,it.en,it.m,it.syn,it.s&&it.s[0],it.s&&it.s[1]].join(' '));
    return q.split(/\s+/).every(function(t){return hay.indexOf(t)>=0});
  }
  function render(){
    var q=hira(state.q.trim());
    var rows=DATA.filter(function(it){
      if(state.sec!=='all'&&it.secs.indexOf(state.sec)<0)return false;
      if(state.hot&&it.ex.length<2)return false;
      if(state.known&&KNOWN[it.w])return false;
      return match(it,q);
    });
    var s=state.sort;
    if(s==='freq')rows.sort(function(a,b){return b.ex.length-a.ex.length||newest(b)-newest(a)});
    else if(s==='kana')rows.sort(function(a,b){return sortKey(a)<sortKey(b)?-1:sortKey(a)>sortKey(b)?1:0});
    else if(s==='new')rows.sort(function(a,b){return newest(b)-newest(a)});
    var out='';
    if(!rows.length)out='<div class="empty">条件に合う語がありません。検索語や絞り込みを変えてください。</div>';
    else if(s==='sec'&&state.sec==='all'){
      SECS.forEach(function(sec){
        var g=rows.filter(function(it){return it.secs.indexOf(sec)>=0});
        g.sort(function(a,b){return b.ex.length-a.ex.length||newest(b)-newest(a)});
        if(!g.length)return;
        out+='<h2 class="grp">'+SECNAME[sec]+'<span>'+g.length+'語</span></h2><div class="list">'+g.map(card).join('')+'</div>';
      });
    }else out='<div class="list">'+rows.map(card).join('')+'</div>';
    document.getElementById('out').innerHTML=out;
    document.getElementById('count').textContent=rows.length+' / '+DATA.length+' 語';
  }
  function buildChips(){
    var el=document.getElementById('secs');
    var defs=[['all','すべて',DATA.length]].concat(SECS.map(function(s){return [s,SECNAME[s],DATA.filter(function(i){return i.secs.indexOf(s)>=0}).length]}));
    el.innerHTML=defs.map(function(d){return '<button type="button" class="chip" data-s="'+d[0]+'" aria-pressed="'+(state.sec===d[0])+'">'+esc(d[1])+'<small>'+d[2]+'</small></button>'}).join('');
  }
  function init(){
    var exams={};DATA.forEach(function(i){i.ex.forEach(function(e){exams[e[0]]=1})});
    document.getElementById('stats').innerHTML='<span><b>'+DATA.length+'</b> 語</span><span><b>'+DATA.filter(function(i){return i.ex.length>1}).length+'</b> 語が複数回出題</span><span><b>'+Object.keys(exams).length+'</b> 回分の試験</span>';
    buildChips();render();
  }
  var t;
  document.getElementById('q').addEventListener('input',function(e){clearTimeout(t);var v=e.target.value;t=setTimeout(function(){state.q=v;render()},120)});
  document.getElementById('secs').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;state.sec=b.getAttribute('data-s');
    Array.prototype.forEach.call(this.children,function(c){c.setAttribute('aria-pressed',c===b)});render();
  });
  document.getElementById('sort').addEventListener('change',function(e){state.sort=e.target.value;render()});
  document.getElementById('f-hot').addEventListener('change',function(e){state.hot=e.target.checked;render()});
  document.getElementById('f-known').addEventListener('change',function(e){state.known=e.target.checked;render()});
  document.getElementById('h-m').addEventListener('change',function(e){document.body.classList.toggle('hide-m',e.target.checked)});
  document.getElementById('h-r').addEventListener('change',function(e){document.body.classList.toggle('hide-r',e.target.checked)});
  document.getElementById('out').addEventListener('click',function(e){
    var cardEl=e.target.closest('.card');if(!cardEl)return;
    if(e.target.classList.contains('kn')){
      var w=cardEl.getAttribute('data-w');
      if(e.target.checked)KNOWN[w]=1;else delete KNOWN[w];
      saveKnown();cardEl.classList.toggle('known',e.target.checked);
      if(state.known&&e.target.checked)setTimeout(render,250);
      return;
    }
    if(e.target.closest('label'))return;
    cardEl.classList.toggle('show');
  });
  fetch('vocab.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){DATA=d;init()}).catch(function(){
    document.getElementById('out').innerHTML='<div class="empty">語彙データを読み込めませんでした。ページを開き直してください。</div>';
  });
})();
</script>
</body>
</html>
